schema-version = "1.13.0"

[install]
rustup.pkg-path = "rustup"
cargo-nextest.pkg-path = "cargo-nextest"
pkg-config.pkg-path = "pkg-config"
xorg-libX11.pkg-path = "xorg.libX11"
xorg-libX11.outputs = ["out", "dev"]
glib.pkg-path = "glib"
glib.outputs = ["out", "dev"]
alsa-lib.pkg-path = "alsa-lib"
alsa-lib.outputs = ["out", "dev"]
alsa-lib.systems = ["aarch64-linux", "x86_64-linux"]
fontconfig.pkg-path = "fontconfig"
fontconfig.outputs = ["out", "dev", "lib"]
fontconfig.systems = ["aarch64-linux", "x86_64-linux"]
cmake.pkg-path = "cmake"
protobuf.pkg-path = "protobuf"
nodejs.pkg-path = "nodejs_22"
pnpm.pkg-path = "nodePackages.pnpm"
nix.pkg-path = "nix"
pre-commit.pkg-path = "pre-commit"
actionlint.pkg-path = "actionlint"
typos.pkg-path = "typos"
lychee.pkg-path = "lychee"

[vars]
CARGO_TERM_COLOR = "always"
RUST_BACKTRACE = "1"
CARGO_INCREMENTAL = "0"

[hook]
on-activate = '''
  rustup show active-toolchain >/dev/null 2>&1 || rustup toolchain install

  if ! command -v mbx >/dev/null 2>&1; then
    mkdir -p "$HOME/.local/bin"
    case "$(uname -s)-$(uname -m)" in
      Darwin-arm64) archive=mbx-aarch64-apple-darwin.tar.gz ;;
      Linux-x86_64) archive=mbx-x86_64-unknown-linux-gnu.tar.gz ;;
      Linux-aarch64|Linux-arm64) archive=mbx-aarch64-unknown-linux-gnu.tar.gz ;;
      *) archive="" ;;
    esac
    if [ -n "$archive" ]; then
      tmp="$(mktemp -d)"
      if curl -fsSL "https://github.com/jdx/mr-boxington/releases/latest/download/$archive" | tar -xzf - -C "$tmp" && [ -f "$tmp/mbx" ]; then
        mv "$tmp/mbx" "$HOME/.local/bin/mbx"
        chmod +x "$HOME/.local/bin/mbx"
      fi
      rm -rf "$tmp"
    fi
  fi
  case ":$PATH:" in *":$HOME/.local/bin:"*) ;; *) export PATH="$HOME/.local/bin:$PATH" ;; esac
'''

[options]
systems = ["aarch64-darwin", "x86_64-darwin", "aarch64-linux", "x86_64-linux"]
