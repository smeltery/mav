name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      markdown_only: ${{ steps.filter.outputs.markdown_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: detect markdown-only changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            changed_files="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          else
            before="${{ github.event.before }}"
            if git cat-file -e "${before}^{commit}" 2>/dev/null; then
              changed_files="$(git diff --name-only "${before}" "${{ github.sha }}")"
            else
              changed_files="$(git diff --name-only HEAD^ HEAD)"
            fi
          fi

          if [[ -n "$changed_files" ]] && ! grep -vE '\.md$' <<< "$changed_files" >/dev/null; then
            echo "markdown_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "markdown_only=false" >> "$GITHUB_OUTPUT"
          fi

  hygiene:
    name: hygiene
    needs: changes
    if: needs.changes.outputs.markdown_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: flox/install-flox-action@v2
      # Expose Flox's rustc on PATH so mr-boxington-action keys the cache by
      # the compiler the build will use (not the literal `norust`).
      - name: Expose Flox rustc for mbx cache key
        # Expand command -v inside flox's bash -c, not the runner shell.
        run: flox activate -- bash -c "dirname \"\$(command -v rustc)\"" >> "$GITHUB_PATH"
      - uses: jdx/mr-boxington-action@v1
      - name: format
        run: flox activate -- cargo fmt --all -- --check
      - name: file line budget
        run: script/check-file-lines 500
      - name: manifest check
        run: flox activate -- mbx check -p mav --bin mav --locked

  nix:
    name: nix
    needs: changes
    if: needs.changes.outputs.markdown_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: flake check
        run: nix flake check --accept-flake-config

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: flox/install-flox-action@v2
      - name: markdown links
        run: flox activate -- lychee --offline README.md docs/**/*.md
